<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- index.html と同じく、通信(fetch・XHR など)はこのサイトの中だけに限る -->
  <meta http-equiv="Content-Security-Policy" content="connect-src 'self' blob: data:">
  <title>地図 - Trail Album</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6b4f'/%3E%3Cpath d='M4 25 12 11l5 8 4-5 7 11z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <!-- 外部ライブラリ(index.html と同じもの) Leaflet: 地理院地図の表示 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H"
    crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH"
    crossorigin="anonymous" defer></script>
  <script type="module" src="js/map-window-page.js"></script>
</head>
<body class="map-window">
  <!-- 別ウインドウの地図: Trail Album の画面の地図と同じ内容を、ウインドウいっぱいに出す(map-window-page.js) -->
  <div class="map" id="map" hidden></div>
  <p class="map-legend" id="mapLegend" hidden></p>
  <p class="message" id="mapMessage" data-kind="guide">地図の内容を受け取っています…</p>

  <!-- 元の写真の拡大表示(index.html と同じ) -->
  <dialog class="photo-dialog" id="photoDialog" aria-labelledby="dialogCaption">
    <div class="dialog-body">
      <form method="dialog">
        <button type="submit" class="dialog-close" aria-label="閉じる">×</button>
      </form>
      <img id="dialogImage" alt="">
      <p class="dialog-caption" id="dialogCaption"></p>
    </div>
  </dialog>
</body>
</html>
